<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilexi - Settings</title>
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-card: #1e293b;
        --bg-input: #0b1120;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
        --accent-bg: rgba(56, 189, 248, 0.12);
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --success: #10b981;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-primary: #f8fafc;
          --bg-card: #ffffff;
          --bg-input: #f1f5f9;
          --text-primary: #0f172a;
          --text-secondary: #64748b;
          --border-color: #e2e8f0;
          --accent: #0284c7;
          --accent-hover: #0369a1;
          --accent-bg: #e0f2fe;
          --danger: #ef4444;
          --danger-hover: #dc2626;
          --success: #059669;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
